command:
  - uvicorn
  - app:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: DATABRICKS_HOST
    description: Workspace URL for SDK calls (auto-populated at runtime)
  - name: DATABRICKS_TOKEN
    description: Service principal token (auto-populated at runtime)
  - name: REVENUE_TABLE
    value: "dt_dev_platinum.enterprise.sales_daily_store_performance"
  - name: CDI_TABLE
    value: "dt_dev_gold.dwh.fct_cdi_daily"
  - name: PEER_SET_TABLE
    value: "dt_dev_gold.dwh.brg_store_cluster_membership_group"
  - name: TREND_WINDOW_DAYS
    value: "90"
