targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-baff2b7f-4402.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      state_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/state
    variables:
      app_name: multiagent-app-dev
      mlflow_experiment_id: "3025644123415124"
      openai_base_url: ""
      openai_timeout_seconds: "0"
      model_routing_enabled: "true"
      model_routing_default_model: databricks-gpt-5-6-luna
      model_routing_reasoning_model: databricks-gpt-5-6-luna
      model_routing_quality_model: databricks-gpt-5-6-luna
      subagents_config_path: ""
      default_request_persona: "manager"
      app_telemetry_logs_table: "quickstart_catalog.multi_agent_schema.app_logs"
      app_telemetry_metrics_table: "quickstart_catalog.multi_agent_schema.app_metrics"
      app_telemetry_traces_table: "quickstart_catalog.multi_agent_schema.app_traces"
      genie_space_id: "01f159f5d91419549020e3609add391c"
      store_manager_genie_space_id: ""
      executive_genie_space_id: ""
      supply_chain_genie_space_id: ""
      cdi_genie_space_id: "01f19b2ab0f014daa3325ff30142f873"
      knowledge_assistant_endpoint_name: ""
      product_index_ep: "product_index_ep"
      flink_support_ep: "flink_support_ed"
      lakebase_project_id: "ore"
      lakebase_branch_id: "production"
      lakebase_database: "db-j7lf-e5xmy0cwq4"
      memory_backend: "lakebase"
      memory_project_id: "ore"
      memory_branch_id: "production"
      memory_endpoint_id: "primary"
      memory_database: "agent_memory"
      memory_pg_host: "ep-falling-cake-d1j29nc5.database.us-west-2.cloud.databricks.com"
      memory_pg_user: "718a84e4-78d1-4bb5-bca3-ddbc603c2dc6"
      lakebase_sql_warehouse_id: "ep-falling-cake-d1j29nc5"
      message_bus_backend: uc_table
      message_bus_topic: agent-lifecycle-events
      uc_audit_warehouse_id: "b20f70f71c2f52e2"
      uc_audit_catalog: "quickstart_catalog"
      uc_audit_schema: "multi_agent_schema"
      uc_audit_table: agent_lifecycle_events
      approval_backend: uc_table
      approval_warehouse_id: "b20f70f71c2f52e2"
      approval_catalog: "quickstart_catalog"
      approval_schema: "multi_agent_schema"
      approval_table: agent_approval_decisions
      agent_task_backend: uc_table
      agent_task_warehouse_id: "b20f70f71c2f52e2"
      agent_task_catalog: "quickstart_catalog"
      agent_task_schema: "multi_agent_schema"
      agent_task_worker_enabled: "true"
      agent_task_worker_poll_seconds: "1"
    resources:
      apps:
        multiagent-app:
          name: multiagent-app-dev
          usage_policy_id: "06846952-d579-4cd7-ab90-b86f0a1e3ed7"
          resources:
          - name: sales_genie_space
            genie_space:
              name: Sales Analysis Agent
              space_id: ${var.genie_space_id}
              permission: 'CAN_RUN'
          - name: cdi_genie_space
            genie_space:
              name: CDI Metrics Agent
              space_id: ${var.cdi_genie_space_id}
              permission: 'CAN_RUN'
          - name: product_search_index
            uc_securable:
              securable_full_name: quickstart_catalog.multi_agent_schema.dim_product_search_index
              securable_type: TABLE
              permission: SELECT
          - name: flink_support_index
            uc_securable:
              securable_full_name: quickstart_catalog.multi_agent_schema.flink_support_index
              securable_type: TABLE
              permission: SELECT
          - name: lakebase_pg_password
            secret:
              scope: multiagent_app
              key: lakebase_pg_password
              permission: READ
          - name: lakebase_ods
            postgres:
              branch: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}
              database: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}/databases/${var.lakebase_database}
              permission: 'CAN_CONNECT_AND_CREATE'