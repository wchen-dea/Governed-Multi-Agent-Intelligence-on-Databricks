targets:
  qa:
    mode: development
    workspace:
      # Platform owner: Databricks workspace URL for QA.
      # Example: https://dbc-xxxxxxxx-xxxx.cloud.databricks.com
      host: PLACE_HOLDER_FOR_DATABRICKS_HOST_QA
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      state_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/state
    variables:
      app_name: multiagent-app-qa
      hitl_app_name: store-intervention-agent-qa
      hitl_sql_warehouse_id: "<QA-HITL-SQL-WAREHOUSE-ID>"
      hitl_revenue_table: "<QA-PLATINUM-CATALOG>.<QA-ENTERPRISE-SCHEMA>.<QA-REVENUE-TABLE>"
      hitl_cdi_table: "<QA-GOLD-CATALOG>.<QA-DWH-SCHEMA>.<QA-CDI-TABLE>"
      hitl_peer_set_table: "<QA-GOLD-CATALOG>.<QA-DWH-SCHEMA>.<QA-PEER-SET-TABLE>"
      hitl_store_dimension_table: "<QA-GOLD-CATALOG>.<QA-DWH-SCHEMA>.<QA-STORE-DIMENSION-TABLE>"
      hitl_trend_window_days: "90"
      openai_base_url: ""
      openai_timeout_seconds: "0"
      model_routing_enabled: "true"
      model_routing_default_model: databricks-gpt-5-6-luna
      model_routing_reasoning_model: databricks-claude-sonnet-5
      model_routing_quality_model: databricks-claude-sonnet-5
      subagents_config_path: ""
      # MLflow owner: experiment used for traces and eval in QA.
      # Example: "1234567890123456" (numeric experiment id as string)
      mlflow_experiment_id: "<QA-MLFLOW-EXPERIMENT-ID>"
      # Data/AI owner: Genie and serving resources for QA.
      # Example: 01f159f5d91419549020e3609add391c
      genie_space_id: "<QA-GENIE-SPACE-ID>"
      # Example: 01f159f5d91419549020e3609add391c
      store_manager_genie_space_id: "<QA-STORE-MANAGER-GENIE-SPACE-ID>"
      # Example: 01f159f5d91419549020e3609add391c
      executive_genie_space_id: "<QA-EXECUTIVE-GENIE-SPACE-ID>"
      # Example: 01f159f5d91419549020e3609add391c
      supply_chain_genie_space_id: "<QA-SUPPLY-CHAIN-GENIE-SPACE-ID>"
      # Example: existing serving endpoint name in QA workspace
      knowledge_assistant_endpoint_name: "<QA-KNOWLEDGE-ASSISTANT-ENDPOINT>"
      # Example: existing serving endpoint name in QA workspace
      serving_endpoint_name: "<QA-SERVING-ENDPOINT>"
      # Example: existing AI search serving endpoint name in QA workspace
      product_index_ep: "<QA-AI-SEARCH-ENDPOINT>"
      # Example: app name that this app can call, e.g. "analytics-assistant-qa"
      target_app_name: "<QA-TARGET-APP-NAME>"
      # Example: Unity Catalog table for Databricks Apps telemetry logs
      app_telemetry_logs_table: "<QA-APP-TELEMETRY-LOGS-TABLE>"
      app_telemetry_metrics_table: "<QA-APP-TELEMETRY-METRICS-TABLE>"
      app_telemetry_traces_table: "<QA-APP-TELEMETRY-TRACES-TABLE>"
      # Observability owner: lifecycle audit sink in QA.
      message_bus_backend: uc_table
      message_bus_topic: agent-lifecycle-events
      # Example: SQL warehouse id from QA workspace
      uc_audit_warehouse_id: "<QA-UC-AUDIT-WAREHOUSE-ID>"
      # Example: Unity Catalog catalog name, e.g. "main"
      uc_audit_catalog: "<QA-UC-AUDIT-CATALOG>"
      # Example: Unity Catalog schema name, e.g. "observability"
      uc_audit_schema: "<QA-UC-AUDIT-SCHEMA>"
      uc_audit_table: agent_lifecycle_events
      approval_backend: uc_table
      approval_warehouse_id: "<QA-UC-AUDIT-WAREHOUSE-ID>"
      approval_catalog: "<QA-UC-AUDIT-CATALOG>"
      approval_schema: "<QA-UC-AUDIT-SCHEMA>"
      approval_table: agent_approval_decisions
    resources:
      apps:
        multiagent-app:
          name: multiagent-app
          compute_size: MEDIUM
          # Example: policy id, e.g. 06846952-d579-4cd7-ab90-b86f0a1e3ed7
          budget_policy_id: "<QA-APP-BUDGET-POLICY-ID>"
          # Example: policy id, e.g. 06846952-d579-4cd7-ab90-b86f0a1e3ed7
          usage_policy_id: "<QA-APP-USAGE-POLICY-ID>"
          # Example scopes from deployed app:
          # - iam.current-user:read
          # - iam.access-control:read
          user_api_scopes:
          - "<QA-APP-USER-API-SCOPE-1>"
          - "<QA-APP-USER-API-SCOPE-2>"
          resources:
          - name: genie_space
            genie_space:
              name: Genie Agent
              space_id: ${var.genie_space_id}
              permission: CAN_RUN
          - name: store_manager_genie_space
            genie_space:
              name: Store Manager Genie Agent
              space_id: ${var.store_manager_genie_space_id}
              permission: CAN_RUN
          - name: executive_genie_space
            genie_space:
              name: Executive Genie Agent
              space_id: ${var.executive_genie_space_id}
              permission: CAN_RUN
          - name: supply_chain_genie_space
            genie_space:
              name: Supply Chain Genie Agent
              space_id: ${var.supply_chain_genie_space_id}
              permission: CAN_RUN
          - name: ai_search_endpoint
            serving_endpoint:
              name: ${var.product_index_ep}
              permission: CAN_QUERY
          - name: knowledge_assistant_product_ep
            serving_endpoint:
              name: ${var.knowledge_assistant_endpoint_name}
              permission: CAN_QUERY