resources:
  apps:
    multiagent-app:
      name: ${var.app_name}
      description: "Multi-agent orchestrator that queries other agents, Genie Agents, and serving endpoints"
      # App access control: assign principals that can use/manage this app.
      # permissions:
      # - level: CAN_USE
      #   service_principal_name: ${var.app_can_use_service_principal_id}
      # - level: CAN_MANAGE
      #   service_principal_name: ${var.app_can_manage_service_principal_id}
      # Optional app properties supported by the Databricks bundle schema.
      # Keep commented unless you intend to enable them for this deployment.
      # budget_policy_id: ${var.app_budget_policy_id}
      # compute_min_instances: 1
      # compute_max_instances: 2
      # compute_size: MEDIUM
      # git_repository:
      #   provider: gitHub
      #   url: https://github.com/wchen-dea/Governed-Multi-Agent-On-Databricks
      # git_source:
      #   branch: main
      #   source_code_path: .
      # lifecycle:
      #   prevent_destroy: false
      #   started: true
      # permissions:
      # - level: CAN_USE
      #   group_name: users
      # space: my-space
      telemetry_export_destinations:
      - unity_catalog:
          logs_table: ${var.app_telemetry_logs_table}
          metrics_table: ${var.app_telemetry_metrics_table}
          traces_table: ${var.app_telemetry_traces_table}
      # usage_policy_id: ${var.app_usage_policy_id}
      user_api_scopes:
      - sql
      source_code_path: ../.databricks_app_source
      config:
        command: ["python", "launcher.py"]
        env:
        - name: MLFLOW_TRACKING_URI
          value: ${var.mlflow_tracking_uri}
        - name: MLFLOW_REGISTRY_URI
          value: ${var.mlflow_registry_uri}
        - name: DATABRICKS_OPENAI_BASE_URL
          value: ${var.openai_base_url}
        - name: DATABRICKS_OPENAI_TIMEOUT_SECONDS
          value: ${var.openai_timeout_seconds}
        - name: MODEL_ROUTING_ENABLED
          value: ${var.model_routing_enabled}
        - name: MODEL_ROUTING_DEFAULT_MODEL
          value: ${var.model_routing_default_model}
        - name: MODEL_ROUTING_REASONING_MODEL
          value: ${var.model_routing_reasoning_model}
        - name: MODEL_ROUTING_QUALITY_MODEL
          value: ${var.model_routing_quality_model}
        - name: API_PROXY
          value: ${var.api_proxy}
        - name: CHAT_APP_PORT
          value: ${var.chat_app_port}
        - name: CHAT_PROXY_TIMEOUT_SECONDS
          value: ${var.chat_proxy_timeout_seconds}
        - name: SUBAGENTS_CONFIG_PATH
          value: ${var.subagents_config_path}
        - name: DEFAULT_REQUEST_PERSONA
          value: ${var.default_request_persona}
        - name: MAX_INPUT_CHARS
          value: ${var.max_input_chars}
        - name: MAX_RESPONSE_CHARS
          value: ${var.max_response_chars}
        - name: MLFLOW_EXPERIMENT_ID
          value: ${var.mlflow_experiment_id}
        - name: MESSAGE_BUS_BACKEND
          value: ${var.message_bus_backend}
        - name: MESSAGE_BUS_TOPIC
          value: ${var.message_bus_topic}
        - name: UC_AUDIT_WAREHOUSE_ID
          value: ${var.uc_audit_warehouse_id}
        - name: UC_AUDIT_CATALOG
          value: ${var.uc_audit_catalog}
        - name: UC_AUDIT_SCHEMA
          value: ${var.uc_audit_schema}
        - name: UC_AUDIT_TABLE
          value: ${var.uc_audit_table}
        - name: APPROVAL_BACKEND
          value: ${var.approval_backend}
        - name: APPROVAL_WAREHOUSE_ID
          value: ${var.approval_warehouse_id}
        - name: APPROVAL_CATALOG
          value: ${var.approval_catalog}
        - name: APPROVAL_SCHEMA
          value: ${var.approval_schema}
        - name: APPROVAL_TABLE
          value: ${var.approval_table}
        - name: APPROVAL_DELEGATION_ENABLED
          value: ${var.approval_delegation_enabled}
        - name: APPROVAL_DELEGATION_SOURCE_AGENT
          value: ${var.approval_delegation_source_agent}
        - name: APPROVAL_DELEGATION_TARGET_AGENT
          value: ${var.approval_delegation_target_agent}
        - name: APPROVAL_DELEGATION_INTENT
          value: ${var.approval_delegation_intent}
        - name: AGENT_TASK_BACKEND
          value: ${var.agent_task_backend}
        - name: AGENT_TASK_WAREHOUSE_ID
          value: ${var.agent_task_warehouse_id}
        - name: AGENT_TASK_CATALOG
          value: ${var.agent_task_catalog}
        - name: AGENT_TASK_SCHEMA
          value: ${var.agent_task_schema}
        - name: AGENT_TASK_WORKER_ENABLED
          value: ${var.agent_task_worker_enabled}
        - name: AGENT_TASK_WORKER_POLL_SECONDS
          value: ${var.agent_task_worker_poll_seconds}
        - name: MEMORY_BACKEND
          value: ${var.memory_backend}
        - name: MEMORY_PROJECT_ID
          value: ${var.memory_project_id}
        - name: MEMORY_BRANCH_ID
          value: ${var.memory_branch_id}
        - name: MEMORY_ENDPOINT_ID
          value: ${var.memory_endpoint_id}
        - name: MEMORY_DATABASE
          value: ${var.memory_database}
        - name: MEMORY_PG_HOST
          value: ${var.memory_pg_host}
        - name: MEMORY_PG_USER
          value: ${var.memory_pg_user}
      # Resources which this app has access to
      resources:
      - name: 'sales_genie_space'
        genie_space:
          name: 'Sales Genie Agent'
          space_id: ${var.genie_space_id}
          permission: 'CAN_RUN'
      - name: 'cdi_genie_space'
        genie_space:
          name: 'CDI Metrics Agent'
          space_id: ${var.cdi_genie_space_id}
          permission: 'CAN_RUN'
      - name: 'product_search_index'
        uc_securable:
          securable_full_name: 'quickstart_catalog.multi_agent_schema.dim_product_search_index'
          securable_type: 'TABLE'
          permission: 'SELECT'
      - name: 'flink_support_index'
        uc_securable:
          securable_full_name: 'quickstart_catalog.multi_agent_schema.flink_support_index'
          securable_type: 'TABLE'
          permission: 'SELECT'
      - name: 'lakebase_pg_password'
        secret:
          scope: 'multiagent_app'
          key: 'lakebase_pg_password'
          permission: 'READ'
      - name: 'lakebase_ods'
        postgres:
          branch: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}
          database: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}/databases/${var.lakebase_database}
          permission: 'CAN_CONNECT_AND_CREATE'