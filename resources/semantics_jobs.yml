resources:
  jobs:
    create-gmai-mcp-agent-product-search-index:
      name: create-gmai-mcp-agent-product-search-index
      tags:
        layer: semantics
      tasks:
      - task_key: build_index
        notebook_task:
          notebook_path: ../src/semantics/create-gmai-mcp-agent-product-search-index.py
          base_parameters:
            catalog: ${var.semantics_catalog}
            schema: ${var.semantics_schema}
            endpoint_name: ${var.product_index_ep}
    create-gmai-mcp-agent-flink-support-index:
      name: create-gmai-mcp-agent-flink-support-index
      tags:
        layer: semantics
      tasks:
      - task_key: build_index
        environment_key: flink_support_env
        notebook_task:
          notebook_path: ../src/semantics/create-gmai-mcp-agent-flink-support-index.py
          base_parameters:
            catalog: ${var.semantics_catalog}
            schema: ${var.semantics_schema}
            endpoint_name: ${var.flink_support_ep}
      environments:
      - environment_key: flink_support_env
        spec:
          environment_version: "2"
          dependencies:
          - python-docx
          - pypdf
          - openpyxl
    create-gmai-genie-agent-cdi-metric-view:
      name: create-gmai-genie-agent-cdi-metric-view
      tags:
        layer: semantics
      tasks:
      - task_key: build_metric_view
        notebook_task:
          notebook_path: ../src/semantics/create-gmai-genie-agent-cdi-metric-view.py
          base_parameters:
            catalog: ${var.semantics_catalog}
            schema: ${var.semantics_schema}