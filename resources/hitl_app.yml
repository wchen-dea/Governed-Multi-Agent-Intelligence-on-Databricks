resources:
  apps:
    hitl-app-agent:
      name: ${var.hitl_app_name}
      description: "HITL specialist that prepares governed store intervention packets"
      user_api_scopes:
      - sql
      source_code_path: ../src/hitl-agent
      config:
        command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        - name: HITL_ENV
          value: ${bundle.target}
        - name: SNAPSHOT_TABLE
          value: ${var.hitl_snapshot_table}
        - name: SQL_WAREHOUSE_ID
          value: ${var.hitl_sql_warehouse_id}
        - name: TREND_WINDOW_DAYS
          value: ${var.hitl_trend_window_days}
      resources:
      - name: hitl_sql_warehouse
        sql_warehouse:
          id: ${var.hitl_sql_warehouse_id}
          permission: CAN_USE
      - name: hitl_snapshot
        uc_securable:
          securable_full_name: ${var.hitl_snapshot_table}
          securable_type: TABLE
          permission: SELECT