[project]
name = "multiagent-app-on-databricks"
version = "0.1.7"
description = "Multi-agent orchestrator that queries other agents, Genie Agents, and serving endpoints"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-openai>=0.13.0",
    "databricks-agents>=1.9.3",
    "mlflow>=3.10.0",
    "openai-agents>=0.4.1",
    "python-dotenv>=1.2.1",
    "chainlit>=2.0.0",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
]

setup = [
    "ruamel.yaml>=0.18.0",
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
]

[tool.uv]
default-groups = ["dev", "setup"]

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/scripts", "src/frontend"]

[tool.pytest.ini_options]
pythonpath = ["src"]


[project.scripts]
# Runtime core: commands required to run, validate, and package the application.
runtime-serve-app = "scripts.start_app:main"
runtime-serve-backend = "backend.api.server:main"
runtime-preflight = "scripts.preflight:main"
runtime-build-source = "scripts.prepare_app_source:main"
# Assistant and operations: evaluation, discovery, setup, permissions, and diagnostics.
assistant-bootstrap = "scripts.quickstart:main"
assistant-evaluate = "backend.evaluate_agent:evaluate"
assistant-discover-tools = "scripts.discover_tools:main"
assistant-setup-flink = "scripts.setup_flink_support_rag:main"
assistant-setup-cdi = "scripts.setup_cdi_agent:main"
assistant-grant-app-permissions = "scripts.grant_app_runtime_permissions:main"
assistant-grant-lakebase-memory = "scripts.grant_lakebase_memory_permissions:main"
assistant-benchmark-stream = "scripts.benchmark_stream_parsing:main"
