[project]
name = "multiagent-app-on-databricks"
version = "1.0.0"
description = "Multi-agent orchestrator that queries other agents, Genie Agents, and serving endpoints"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-openai>=0.13.0",
    "databricks-agents>=1.9.3",
    "mlflow>=3.10.0",
    "openai-agents>=0.4.1",
    "python-dotenv>=1.2.1",
    "chainlit>=2.0.0",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.9",
    "databricks-ai-bridge[memory]>=0.21.0",
    "mysql-connector-python>=26.7.0",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]

setup = [
    "ruamel.yaml>=0.18.0",
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
]

[tool.uv]
default-groups = ["dev", "setup"]

[tool.hatch.build.targets.wheel]
packages = ["src/aiserver", "src/operations"]
# Built React UI assets are gitignored (regenerated by prepare_app_source.py)
# but must still ship inside the wheel; hatchling's default VCS-based file
# selection would otherwise drop them.
artifacts = ["src/aiserver/static/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".databricks_app_source",
    "mlruns",
    # Databricks notebooks: use notebook-only globals (spark, dbutils) and
    # cell-separated imports (# COMMAND ----------), not importable modules.
    "src/semantics",
    "src/evaluation",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]


[project.scripts]
# Runtime core: commands required to run, validate, and package the application.
# Single-process server: serves the API and (if bundled) the React UI in-process.
runtime-serve-app = "aiserver.api.server:main"
# Same target as runtime-serve-app: kept as a distinct alias for local dev
# invocation (--reload/--port/--workers), referenced by name in preflight.py
# and dev docs. Do not remove without updating those call sites.
runtime-serve-backend = "aiserver.api.server:main"
runtime-preflight = "operations.preflight:main"
runtime-build-source = "operations.prepare_app_source:main"
# Assistant and operations: evaluation, discovery, setup, permissions, and diagnostics.
assistant-bootstrap = "operations.quickstart:main"
assistant-evaluate = "operations.evaluate_agent:evaluate"
assistant-discover-tools = "operations.discover_tools:main"
assistant-setup-flink = "operations.setup_flink_support_rag:main"
assistant-setup-cdi = "operations.setup_cdi_agent:main"
assistant-grant-app-permissions = "operations.grant_app_runtime_permissions:main"
assistant-grant-lakebase-memory = "operations.grant_lakebase_memory_permissions:main"
assistant-benchmark-stream = "operations.benchmark_stream_parsing:main"
assistant-triage-evaluation = "operations.triage_evaluation_run:main"
