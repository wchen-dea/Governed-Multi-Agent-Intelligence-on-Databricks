bundle:
  name: multiagent-app-on-databricks
  uuid: ad3ec8f6-1ff5-4bb2-bbb7-056bd09c43a8
include:
- resources/*.yml
- targets/*.yml
- resources/*/*.yml
variables:
  app_name:
    description: Databricks app name for the current environment
  mlflow_experiment_id:
    description: MLflow experiment ID for tracing/evaluation in the current environment
  mlflow_tracking_uri:
    description: MLFLOW_TRACKING_URI for the app
    default: databricks
  mlflow_registry_uri:
    description: MLFLOW_REGISTRY_URI for the app
    default: databricks-uc
  openai_base_url:
    description: Optional base URL override for Databricks OpenAI calls (for example Unity AI Gateway URL)
    default: ""
  openai_timeout_seconds:
    description: Optional timeout in seconds for Databricks OpenAI calls; 0 keeps SDK defaults
    default: "0"
  api_proxy:
    description: API proxy URL for the chat app
    default: http://localhost:8000/invocations
  chat_app_port:
    description: CHAT_APP_PORT for the chat app
    default: "3000"
  chat_proxy_timeout_seconds:
    description: CHAT_PROXY_TIMEOUT_SECONDS for the chat app
    default: "300"
  subagents_config_path:
    description: Optional runtime path to an alternate subagents JSON config
    default: ""
  default_request_persona:
    description: Optional default persona used when request does not provide custom_inputs.persona
    default: ""
  genie_space_id:
    description: Genie Agent space ID for the current environment
    default: ""
  store_manager_genie_space_id:
    description: Store Manager Genie Agent space ID for the current environment
    default: ""
  executive_genie_space_id:
    description: Executive Genie Agent space ID for the current environment
    default: ""
  supply_chain_genie_space_id:
    description: Supply Chain Genie Agent space ID for the current environment
    default: ""
  cdi_genie_space_id:
    description: CDI Genie Agent space ID for the current environment
    default: ""
  knowledge_assistant_endpoint_name:
    description: Knowledge assistant serving endpoint name for the current environment
    default: ""
  serving_endpoint_name:
    description: Primary serving endpoint name for the current environment
    default: ""
  ai_search_endpoint_name:
    description: AI search serving endpoint name for the current environment
    default: ""
  flink_support_vs_endpoint_name:
    description: Vector Search endpoint name for the Flink support RAG index
    default: "flink-support-vs-endpoint"
  lakebase_project_id:
    description: Lakebase project ID for the operational data store
    default: ""
  lakebase_branch_id:
    description: Lakebase branch ID for the operational data store
    default: ""
  lakebase_database:
    description: Lakebase database name for the operational data store
    default: ""
  target_app_name:
    description: Target Databricks app name granted CAN_USE for the current environment
    default: ""
  app_can_use_service_principal_id:
    description: Service principal application ID granted CAN_USE on the app
    default: ""
  app_can_manage_service_principal_id:
    description: Service principal application ID granted CAN_MANAGE on the app
    default: ""
  message_bus_backend:
    description: Message bus backend (structured_logging, noop, kafka, rabbitmq, uc_table)
    default: structured_logging
  message_bus_topic:
    description: Message bus topic/exchange name
    default: agent-lifecycle-events
  uc_audit_warehouse_id:
    description: SQL warehouse id used for UC audit table writes
    default: ""
  uc_audit_catalog:
    description: Unity Catalog catalog for audit event table
    default: ""
  uc_audit_schema:
    description: Unity Catalog schema for audit event table
    default: ""
  uc_audit_table:
    description: Unity Catalog table name for lifecycle events
    default: agent_lifecycle_events
  app_telemetry_logs_table:
    description: Unity Catalog table for Databricks Apps telemetry export
    default: quickstart_catalog.multi_agent_schema.app_logs
  app_telemetry_metrics_table:
    description: Unity Catalog table for Databricks Apps telemetry metrics
    default: quickstart_catalog.multi_agent_schema.app_metrics
  app_telemetry_traces_table:
    description: Unity Catalog table for Databricks Apps telemetry traces
    default: quickstart_catalog.multi_agent_schema.app_traces