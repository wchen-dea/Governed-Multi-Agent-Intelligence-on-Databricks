bundle:
  name: multiagent-app-on-databricks
  uuid: ad3ec8f6-1ff5-4bb2-bbb7-056bd09c43a8
include:
- resources/*.yml
- targets/*.yml
- resources/*/*.yml
artifacts:
  multiagent_wheel:
    type: whl
    # Deploy tooling (for example the VS Code Databricks extension) may run this
    # build command outside a login shell, where ~/.local/bin (uv's default
    # install location) is not yet on PATH.
    build: PATH="$HOME/.local/bin:$PATH" uv build --wheel
variables:
  app_name:
    description: Databricks app name for the current environment
  hitl_app_name:
    description: Databricks HITL specialist app name for the current environment
    default: hitl-app-agent
  hitl_sql_warehouse_id:
    description: SQL warehouse used by the HITL specialist App for source queries
    default: ""
  hitl_revenue_table:
    description: Platinum-layer revenue source table for the HITL specialist App
    default: ""
  hitl_cdi_table:
    description: Gold-layer CDI source table for the HITL specialist App
    default: ""
  hitl_peer_set_table:
    description: Gold-layer peer-set source table for the HITL specialist App
    default: ""
  hitl_store_dimension_table:
    description: Gold-layer store dimension source table for the HITL specialist App
    default: ""
  hitl_trend_window_days:
    description: Rolling window in days for HITL trend analysis
    default: "90"
  mlflow_experiment_id:
    description: MLflow experiment ID for tracing/evaluation in the current environment
  mlflow_tracking_uri:
    description: MLFLOW_TRACKING_URI for the app
    default: databricks
  mlflow_registry_uri:
    description: MLFLOW_REGISTRY_URI for the app
    default: databricks-uc
  openai_base_url:
    description: Optional base URL override for Databricks OpenAI calls (for example Unity AI Gateway URL)
    default: ""
  openai_timeout_seconds:
    description: Optional timeout in seconds for Databricks OpenAI calls; 0 keeps SDK defaults
    default: "0"
  model_routing_enabled:
    description: Whether the orchestrator selects a configured model by request task type
    default: "true"
  model_routing_default_model:
    description: Databricks model for standard lookups and conversational requests
    default: databricks-gpt-5-6-luna
  model_routing_reasoning_model:
    description: Databricks model for operational, SQL, support, and troubleshooting tasks
    default: databricks-claude-sonnet-5
  model_routing_quality_model:
    description: Databricks model for analysis, comparison, and recommendation tasks
    default: databricks-claude-sonnet-5
  api_proxy:
    description: API proxy URL for the chat app
    default: http://localhost:8000/invocations
  chat_app_port:
    description: CHAT_APP_PORT for the chat app
    default: "3000"
  chat_proxy_timeout_seconds:
    description: CHAT_PROXY_TIMEOUT_SECONDS for the chat app
    default: "300"
  stream_execution_timeout_seconds:
    description: Maximum backend stream execution time before a controlled timeout response
    default: "240"
  subagents_config_path:
    description: Optional runtime path to an alternate subagents JSON config
    default: ""
  default_request_persona:
    description: Optional default persona used when request does not provide custom_inputs.persona
    default: store-manager
  max_input_chars:
    description: Maximum user input characters accepted before routing
    default: "12000"
  max_response_chars:
    description: Maximum response characters before deterministic truncation
    default: "20000"
  genie_space_id:
    description: Genie Agent space ID for the current environment
    default: ""
  store_manager_genie_space_id:
    description: Store Manager Genie Agent space ID for the current environment
    default: ""
  executive_genie_space_id:
    description: Executive Genie Agent space ID for the current environment
    default: ""
  supply_chain_genie_space_id:
    description: Supply Chain Genie Agent space ID for the current environment
    default: ""
  cdi_genie_space_id:
    description: CDI Genie Agent space ID for the current environment
    default: ""
  knowledge_assistant_endpoint_name:
    description: Knowledge assistant serving endpoint name for the current environment
    default: ""
  serving_endpoint_name:
    description: Primary serving endpoint name for the current environment
    default: ""
  product_index_ep:
    description: AI search serving endpoint name for the current environment
    default: "product_index_ep"
  flink_support_ep:
    description: Vector Search endpoint name for the Flink support RAG index
    default: "flink-support-ed"
  semantics_catalog:
    description: Unity Catalog catalog for semantics-layer tables, indexes, and metric views
    default: quickstart_catalog
  semantics_schema:
    description: Unity Catalog schema for semantics-layer tables, indexes, and metric views
    default: multi_agent_schema
  lakebase_project_id:
    description: Lakebase project ID for the operational data store
    default: ""
  lakebase_branch_id:
    description: Lakebase branch ID for the operational data store
    default: ""
  lakebase_database:
    description: Lakebase database name for the operational data store
    default: ""
  lakebase_sql_warehouse_id:
    description: SQL warehouse or Lakebase endpoint ID for app resource grant
    default: ""
  lakebase_pg_password:
    description: Deprecated; use the multiagent_app/lakebase_pg_password secret
    default: ""
  target_app_name:
    description: Target Databricks app name granted CAN_USE for the current environment
    default: ""
  app_can_use_service_principal_id:
    description: Service principal application ID granted CAN_USE on the app
    default: ""
  app_can_manage_service_principal_id:
    description: Service principal application ID granted CAN_MANAGE on the app
    default: ""
  message_bus_backend:
    description: Message bus backend (structured_logging, noop, kafka, rabbitmq, uc_table)
    default: structured_logging
  message_bus_topic:
    description: Message bus topic/exchange name
    default: agent-lifecycle-events
  memory_backend:
    description: Conversation memory backend (disabled or lakebase)
    default: disabled
  memory_project_id:
    description: Lakebase project ID for conversation/persona memory persistence
    default: ""
  memory_branch_id:
    description: Lakebase branch ID for conversation/persona memory persistence
    default: ""
  memory_endpoint_id:
    description: Lakebase endpoint ID for conversation/persona memory persistence
    default: ""
  memory_database:
    description: Lakebase database name for conversation/persona memory persistence
    default: ""
  memory_pg_host:
    description: Lakebase Postgres host for conversation/persona memory persistence
    default: ""
  memory_pg_user:
    description: Lakebase Postgres role for conversation/persona memory persistence
    default: ""
  uc_audit_warehouse_id:
    description: SQL warehouse id used for UC audit table writes
    default: ""
  uc_audit_catalog:
    description: Unity Catalog catalog for audit event table
    default: ""
  uc_audit_schema:
    description: Unity Catalog schema for audit event table
    default: ""
  uc_audit_table:
    description: Unity Catalog table name for lifecycle events
    default: agent_lifecycle_events
  approval_backend:
    description: Approval decision backend (memory or uc_table)
    default: memory
  approval_warehouse_id:
    description: SQL warehouse id used by the UC approval repository
    default: ""
  approval_catalog:
    description: Unity Catalog catalog for approval decisions
    default: ""
  approval_schema:
    description: Unity Catalog schema for approval decisions
    default: ""
  approval_table:
    description: Unity Catalog table for approval decisions
    default: agent_approval_decisions
  approval_delegation_enabled:
    description: Whether approved HITL decisions create durable follow-up delegation tasks
    default: "true"
  approval_delegation_source_agent:
    description: Source agent recorded on approved HITL follow-up tasks
    default: approval-api
  approval_delegation_target_agent:
    description: Target agent for approved HITL follow-up tasks
    default: store-intervention-agent
  approval_delegation_intent:
    description: Intent recorded on approved HITL follow-up tasks
    default: store_intervention_planning
  agent_task_backend:
    description: Delegation task backend (memory or uc_table)
    default: memory
  agent_task_warehouse_id:
    description: SQL warehouse id used by the UC delegation task backend
    default: ""
  agent_task_catalog:
    description: Unity Catalog catalog for delegation task tables
    default: ""
  agent_task_schema:
    description: Unity Catalog schema for delegation task tables
    default: ""
  agent_task_worker_enabled:
    description: Whether the backend starts the durable delegation worker
    default: "false"
  agent_task_worker_poll_seconds:
    description: Idle poll interval in seconds for the durable delegation worker
    default: "1"
  app_telemetry_logs_table:
    description: Unity Catalog table for Databricks Apps telemetry export
    default: quickstart_catalog.multi_agent_schema.app_logs
  app_telemetry_metrics_table:
    description: Unity Catalog table for Databricks Apps telemetry metrics
    default: quickstart_catalog.multi_agent_schema.app_metrics
  app_telemetry_traces_table:
    description: Unity Catalog table for Databricks Apps telemetry traces
    default: quickstart_catalog.multi_agent_schema.app_traces
  eval_judge_model:
    description: Model URI used by MLflow built-in LLM judge scorers
    default: databricks:/databricks-claude-sonnet-5
  eval_simulator_user_model:
    description: Model URI used by ConversationSimulator to generate simulated user turns
    default: databricks:/databricks-claude-sonnet-5